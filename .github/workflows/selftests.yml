name: Selbsttest-Center

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_live:
        description: "Fachabläufe mit den konfigurierten Konten im Testbüro ausführen"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Bestehendes @eslint/js-10 / eslint-9 Peer-Delta betrifft die Testinstallation.
      - id: install
        run: npm ci --legacy-peer-deps
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:selftest-coverage
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:selftest:coverage-check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck:selftest
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:selftest
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: e2e-install
        run: npm ci --prefix e2e
      - if: ${{ !cancelled() && steps.e2e-install.outcome == 'success' }}
        id: chromium-install
        run: npx --prefix e2e playwright install --with-deps chromium
      - if: ${{ !cancelled() && steps.chromium-install.outcome == 'success' }}
        run: npm run test:e2e -- --project=public --project=election-map
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selftest-browser-failures
          path: |
            work/e2e-results
            work/e2e-report

  database-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/database/package-lock.json
      - run: npm ci --prefix tests/database
      - run: npm --prefix tests/database test

  live-workflows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Live-Fachabläufe und Rollenprüfung (verbindlich)
        run: npm run test:e2e -- --project=live
        env:
          E2E_LIVE: "1"
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_TENANT_ID: ${{ secrets.E2E_TENANT_ID }}
          E2E_LEAD_EMAIL: ${{ secrets.E2E_LEAD_EMAIL }}
          E2E_LEAD_PASSWORD: ${{ secrets.E2E_LEAD_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: selftest-live-results
          path: |
            work/e2e-results
            work/e2e-report
